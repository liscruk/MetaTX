name: metatx-flair
# FLAIR >= 3.0 is required for `flair transcriptome`.
# Mirrors the upstream env (misc/flair_conda_env.yaml in BrooksLabUCSC/flair v3.0.1);
# pysam/mappy come from bioconda to avoid compiling them via pip.
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python>=3.12,<3.15
  - minimap2=2.30
  - samtools=1.22.1
  - bedtools=2.31.1
  - pysam>=0.23,<0.24
  - mappy>=2.28
  - pip
  - pip:
      - flair-brookslab==3.0.1
